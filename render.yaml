# Render Blueprint for the Payload CMS. Values for sync:false keys are
# entered once in the Render dashboard when the Blueprint is created.
services:
  - type: web
    name: jorkaring-cms
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: payload
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /admin
    # Only CMS changes redeploy; frontend pushes don't burn free build minutes
    buildFilter:
      paths:
        - payload/**
    envVars:
      # Node gives each address of Neon's multi-IP host only 250 ms by default;
      # on the 0.1 CPU free instance under load that can fail a DB connect.
      - key: NODE_OPTIONS
        value: --network-family-autoselection-attempt-timeout=2000
      - key: DATABASE_URL
        sync: false
      - key: PAYLOAD_SECRET
        sync: false
      - key: PAYLOAD_PUBLIC_SERVER_URL
        sync: false
      - key: PREVIEW_URL
        value: https://jorkaring-web-preview.onrender.com
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: PAYLOAD_ADMIN_EMAIL
        sync: false
      - key: PAYLOAD_ADMIN_PASSWORD
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

  # Live preview for the admin: Nuxt in SSR mode with draft content. Sleeps
  # like the CMS; the first preview after idle takes about a minute.
  - type: web
    name: jorkaring-web-preview
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: web
    dockerfilePath: ./Dockerfile.preview
    dockerContext: .
    healthCheckPath: /
    buildFilter:
      paths:
        - web/**
    envVars:
      # Also passed as Docker build args; Dockerfile.preview bakes them in
      - key: NUXT_PAYLOAD_API_URL
        value: https://jorkaring-cms.onrender.com/api
      - key: NUXT_PUBLIC_PAYLOAD_API_URL
        value: https://jorkaring-cms.onrender.com/api
      - key: PAYLOAD_API_URL
        value: https://jorkaring-cms.onrender.com/api
      - key: NUXT_PUBLIC_PAYLOAD_SERVER_URL
        value: https://jorkaring-cms.onrender.com
      - key: NUXT_PUBLIC_PREVIEW_MODE
        value: "true"
