          - heading "1 op 1 rugtraject" [level=2] [ref=e43]
          - paragraph [ref=e44]: In dit traject krijg je opnieuw meer grip op je rugklachten, zodat je niet langer constant moet nadenken over wat wel of niet kan. Je leert begrijpen wat jouw lichaam nodig heeft en ontdekt hoe kleine, haalbare aanpassingen al een groot verschil kunnen maken in je dagelijkse leven.
          - paragraph [ref=e45]: Stap voor stap bouw je meer vertrouwen op in bewegen en belasten, waardoor je lichaam sterker, stabieler en veerkrachtiger wordt. Je leert beter omgaan met moeilijke dagen en weet hoe je klachten sneller kan opvangen, zonder paniek of frustratie.
