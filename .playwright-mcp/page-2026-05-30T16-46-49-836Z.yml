          - paragraph [ref=e140]: Worstel je tijdens het werk regelmatig met rugklachten, spanning of vermoeidheid? Dan helpt een 1-op-1 ergonomiesessie je om opnieuw comfortabeler, energieker en met meer gemak te werken.
          - paragraph [ref=e141]: Dit is een praktische sessie, waarbij we niet alleen praten, maar vooral oefenen en uitproberen. Samen bekijken we jouw werkhouding, bewegingen en typische werkhandelingen, en testen we meteen hoe kleine aanpassingen in houding en techniek een groot verschil kunnen maken in hoe je lichaam aanvoelt.
          - paragraph [ref=e142]: "Tijdens deze sessie leer je sneller herkennen wanneer spanning opbouwt en hoe je daar op een eenvoudige en haalbare manier op kan reageren in je werk: door je houding, beweging of werkwijze slim aan te passen."
