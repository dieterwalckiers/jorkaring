          - generic [ref=e29]:
            - heading "Van rugpatiënt naar bergbeklimmer en alles daartussen" [level=1] [ref=e31]
            - heading "Ik help rugpatiënten opnieuw grip krijgen op hun lichaam en leven, zodat ze niet langer leven vanuit hun diagnose maar vanuit hun mogelijkheden. Zelf heb ik ook ervaren hoe rugklachten je kunnen beperken, en hoe belangrijk het is om stap voor stap opnieuw vertrouwen en vrijheid op te bouwen." [level=3] [ref=e32]
        - generic [ref=e34]:
          - generic [ref=e38]:
            - heading "Ik ben Jorka Ring" [level=2] [ref=e39]
            - paragraph [ref=e40]: Mijn kindertijd bestond uit bewegen en rebelleren. Ik danste, waagde me aan turnen, voetbalde mee met de jongens en was veel buiten met vriendinnen.
            - paragraph [ref=e41]: "Per toeval ontdekte mijn papa op mijn vijftiende dat mijn houding vreemd was wanneer ik bukte. Na enkele onderzoeken en scans kreeg ik de officiële diagnose: scoliose."
            - paragraph [ref=e42]: Wat volgde, was de ene na de andere scan, consultaties, testjes , noem maar op.
            - paragraph [ref=e43]: Mijn jeugd werd gekenmerkt door ziekenhuis in, ziekenhuis uit, om de scoliose onder controle te houden.
            - paragraph [ref=e44]: Hoe de scoliose precies was ontstaan, werd me nooit uitgelegd. Er werd enkel gezegd dat het goed moest worden opgevolgd en dat ik moest leren leven met zo min mogelijk pijn.
            - paragraph [ref=e45]: "Niet sporten, niet lopen, niet springen. Alles wat ik zo graag deed, werd in twijfel getrokken: “Zou je dat wel doen, Jorka? Heb je veel pijn…?” Steeds opnieuw was ik die persoon die niet mee mocht doen vanwege een diagnose. Het werd een identiteit. Eentje die me beperkte om het leven volop te beleven."
          - img [ref=e48]
        - generic [ref=e50]:
          - generic [ref=e54]:
            - paragraph [ref=e55]: "Toch hadden die vele bezoekjes aan de kinesist ook een ander effect: ze inspireerden me."
            - paragraph [ref=e56]: Ik startte met de opleiding ergotherapie en kwam zo in aanraking met revalidatie, rugscholing en ergonomie. Hierdoor kreeg ik meer inzicht in rugklachten, het ontstaan ervan én mogelijke oplossingen.
            - paragraph [ref=e57]: Dit liet het vertrouwen in mijn lichaam groeien en zo besloot ik het heft in eigen handen te nemen. Ik wilde me niet langer beperkt voelen, maar weer bewegen, me vrij voelen en opnieuw doen wat ik zelf wilde – niet wat mij werd voorgelegd. Alles op mijn eigen wijze.
            - paragraph [ref=e58]: Zo gezegd, zo gedaan. Het begon met een blokje rond lopen in de buurt, en groeide uit tot wekelijkse sessie’s van 10 km in het park. En daar stopte het niet. Ik begon met CrossFit, fietste, ging kamperen, en tegenwoordig maak ik trektochten door de bergen.
          - img [ref=e61]
        - generic [ref=e63]:
          - generic [ref=e67]:
            - paragraph [ref=e68]: Dat kwam niet vanzelf. Ik moest leren luisteren naar mijn lichaam en begrijpen wat het me wilde vertellen – in plaats van alles te verdoezelen met stretchen en pijnstilling. Zo bouwde ik, op mijn eigen tempo en mijn eigen manier, de controle terug op over mijn lijf en mijn leven.
            - paragraph [ref=e69]: "De dingen vermijden die je leuk vindt, en continu leven met angst voor rugpijn, is geen leven. Daarom kijk ik in mijn werkwijze verder dan enkel de diagnose: levenskwaliteit staat centraal. Zodat rugpatiënten zich weer mens voelen in plaats van een diagnose."
            - paragraph [ref=e70]: Want pijn hoeft je leven niet te bepalen, jij wel.
          - img [ref=e73]
