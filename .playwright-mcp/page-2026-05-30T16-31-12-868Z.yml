            - heading "Wie ben ik" [level=2] [ref=e196]
            - paragraph [ref=e197]: "Ik hoor het zo vaak: zodra er een diagnose valt, lijkt het alsof er ineens niets meer mag met de rug. Activiteiten worden geschrapt, pijn vermijden wordt het hoofddoel en goedbedoelde adviezen maken mensen afhankelijk: “Zonder kiné kan je niet pijnvrij zijn”, “Een jaarlijkse inspuiting is de enige optie”…"
            - paragraph [ref=e198]: Mijn hart breekt, want zo raak je niet alleen fysiek maar ook mentaal steeds verder in een hoek geduwd. Terwijl het leven net bedoeld is om beleefd te worden, niet om uit te zitten.
            - paragraph [ref=e199]: Maar het kan anders.
            - paragraph [ref=e200]: Een leven waarin je volop geniet, ook met een rug die soms protesteert, bestaat echt. Daarom help ik mensen om het heft terug in eigen handen te nemen en die afhankelijkheid los te laten.
            - paragraph [ref=e201]: "We werken samen aan je rug op een manier die past bij je leven: op eigen tempo, met haalbare stappen en zonder eindeloze, saaie oefenlijstjes. Een aanpak die integreert in jouw dag, in plaats van jouw agenda te beheersen."
            - paragraph [ref=e202]: Zodat je opnieuw kan kiezen voor beleven, in plaats van overleven.
