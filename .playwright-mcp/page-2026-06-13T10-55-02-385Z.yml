            - paragraph [ref=e77]: Wil jij ook een lager ziekteverzuim, hogere productiviteit en meer werkplezier op de werkvloer?
            - paragraph [ref=e78]: Maar merk je dat de continuïteit binnen je bedrijf onder druk komt te staan doordat medewerkers regelmatig uitvallen met rugklachten?
            - paragraph [ref=e79]: Daardoor stijgt de werkdruk voor collega’s die moeten inspringen, raken teams overbelast en daalt de tevredenheid op de werkvloer. Je blijft brandjes blussen, terwijl de klachten zich blijven opstapelen.
            - paragraph [ref=e80]: Terwijl medewerkers hun gezondheid niet zouden mogen opofferen om hun job te kunnen doen.
            - paragraph [ref=e82]: Daarom geloof ik niet in eindeloze houdingslessen, honderden aanpassingen of dure ergonomische gadgets.
