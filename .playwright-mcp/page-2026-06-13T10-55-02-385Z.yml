              - heading "Wie ben ik" [level=2] [ref=e147]
              - paragraph [ref=e148]: Ik streef ernaar dat bedrijven niet voortdurend moeten reageren op rugklachten en uitval, maar kunnen bouwen op medewerkers die duurzaam inzetbaar blijven.
              - paragraph [ref=e149]:
                - text: "Ik zie nog te vaak gebeuren dat rugklachten op de werkvloer worden aangepakt met losse oplossingen: een ergonomische tool, een houdingsposter of een eenmalige opleiding."
                - text: Goed bedoeld, maar vaak zonder blijvende impact op hoe medewerkers werken, bewegen en omgaan met belasting tijdens hun job.
              - paragraph [ref=e150]: Daardoor blijven klachten terugkomen, stijgt de werkdruk binnen teams en gaat kostbare energie verloren aan het opvangen van uitval en onderbrekingen.
              - paragraph [ref=e151]: Daarom geloof ik niet in ingewikkelde regels, perfecte houdingen of dure ergonomische snufjes.
              - paragraph [ref=e152]: Wel in praktische inzichten en haalbare veranderingen die aansluiten bij de realiteit van de werkvloer. Zodat medewerkers slimmer leren omgaan met belasting, fysieke klachten verminderen en bedrijven kunnen rekenen op meer continuïteit, productiviteit en werkbaarheid.
              - paragraph [ref=e153]:
                - text: Geen tijdelijke oplossingen of symptoombestrijding.
                - text: Wél duurzame verandering die zowel medewerkers als de werking van het bedrijf versterkt.
              - paragraph [ref=e154]: Zodat mensen met meer energie en een glimlach kunnen werken, en bedrijven minder tijd verliezen aan klachten en uitval.
