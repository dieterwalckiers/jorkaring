            - heading "Wie ben ik" [level=2] [ref=e202]
            - paragraph [ref=e203]: Ik streef ernaar dat mijn rugpatiënten zich mens voelen in plaats van diagnose.
            - paragraph [ref=e204]: Ik zie nog te vaak gebeuren dat er enkel beslissingen worden gemaakt ter verbetering van de rug, maar zonder rekening te houden met hoe hun leven eruitziet, wat zij belangrijk vinden en waar zij energie van krijgen.
            - paragraph [ref=e205]: Programma’s of therapieën die hen vertellen dat ze hun favoriete sport niet meer mogen beoefenen, tiltechnieken die ervoor zorgen dat ze bij elke beweging moeten nadenken. Alles ten goede van de rug, maar niet ten goede van de levenskwaliteit.
            - paragraph [ref=e206]: Daarom is het mijn missie om rugpatiënten zelf het inzicht en controle (terug) geven over hun lijf en leven. Zodat zij niet enkel leren wat hun rug ze probeert te vertellen, maar ook hoe zij dit kunnen verhelpen op een manier die bijdraagt aan hun leven.
            - paragraph [ref=e207]: Geen quick fixes, geen afhankelijkheid van therapie.
            - paragraph [ref=e208]: Wél inzicht, vrijheid en duurzame verandering. Levenslang.
            - paragraph [ref=e209]: Zodat ze terug met een glimlach in het leven kunnen staan en hun leven kunnen gaan beleven!
