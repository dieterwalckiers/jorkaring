            - paragraph [ref=e44]: "Je wilt voluit leven: bewegen zonder nadenken, doen waar je zin in hebt, maar je rug houd je constant tegen."
            - paragraph [ref=e45]: Pijnscheuten, stijfheid bij het opstaan, een constante spanning op de achtergrond. Het beïnvloedt je hele dag.
            - paragraph [ref=e46]: "Je probeert van alles om er vanaf te komen: oefeningen, therapie, houdingen vermijden en eindeloze coretraining. Altijd bezig met je rug, om maar pijn te vermijden."
            - paragraph [ref=e47]: Langzaam aan voel je je meer patiënt dan mens.
            - paragraph [ref=e48]: Het is vermoeiend en frustrerend.
            - paragraph [ref=e49]: Je wil gewoon leven, zonder er constant over na te denken.
            - paragraph [ref=e50]: Maar de oplossing ligt niet in nog een behandeling, een nieuwe matras of blijven vermijden wat pijn doet.
            - paragraph [ref=e51]: Echte verandering begint wanneer je je rug leert begrijpen en ze versterkt op jouw tempo, op een manier die bij je leven past.
            - paragraph [ref=e52]:
              - text: Zo bouw je opnieuw vertrouwen op in je lichaam, zodat je het leven weer volop kan beleven.
              - text: Of je nu wil lopen, actief zijn met je gezin of gewoon je dag pijnvrij doorkomen, ik help je daar graag naartoe.
