# Merges Dependabot's patch/minor updates: base-image bumps and npm security
# fixes. The push to main makes Render rebuild; a failed Render build keeps the
# previous deploy live. Merges made with GITHUB_TOKEN don't start other
# workflows, so web updates dispatch the site deploy explicitly.
name: Dependabot auto-merge

on: pull_request

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2.5.0
      - if: contains(fromJSON('["version-update:semver-patch", "version-update:semver-minor"]'), steps.meta.outputs.update-type)
        run: |
          gh pr merge --squash "$PR_URL"
          if [ "$DIRECTORY" = /web ]; then
            gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY"
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          DIRECTORY: ${{ steps.meta.outputs.directory }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
