name: Build and Deploy

on:
  # Trigger on content changes from Payload CMS webhook
  repository_dispatch:
    types: [content_update]

  # Trigger on code changes
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy.yml'

  # Allow manual trigger
  workflow_dispatch:

# Auto-cancel previous runs when new ones are triggered
# This prevents queue buildup during:
# - Multiple rapid content edits in Payload CMS
# - Bulk content operations (imports, migrations, etc.)
# Only the most recent deploy will complete, saving CI time and ensuring
# the deployed site always reflects the latest content state
concurrency:
  group: deploy-production
  cancel-in-progress: true

# Required for GitHub Pages deployment
permissions:
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('web/pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Cache Nuxt build
        uses: actions/cache@v4
        with:
          path: web/.nuxt
          key: ${{ runner.os }}-nuxt-${{ hashFiles('web/**/*.vue', 'web/**/*.ts', 'web/nuxt.config.ts', 'web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-nuxt-

      - name: Download media from Payload
        working-directory: web
        env:
          PAYLOAD_API_URL: ${{ secrets.PAYLOAD_API_URL }}
        run: pnpm run download-media

      - name: Generate static site
        working-directory: web
        env:
          # Both needed: PAYLOAD_API_URL for server-side rendering, NUXT_PUBLIC_PAYLOAD_API_URL for client
          PAYLOAD_API_URL: ${{ secrets.PAYLOAD_API_URL }}
          NUXT_PUBLIC_PAYLOAD_API_URL: ${{ secrets.PAYLOAD_API_URL }}
          # Media files are bundled into the static site at public/api/media/file/,
          # so media URLs should be same-origin (no Railway domain prefix)
          NUXT_PUBLIC_STATIC_MEDIA: 'true'
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: pnpm run generate

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
